name: Bootstrap Learn List v0.2.7 release

on:
  push:
    branches:
      - release/v0.2.7

permissions:
  contents: write

jobs:
  create-release:
    if: github.ref == 'refs/heads/release/v0.2.7'
    runs-on: ubuntu-latest
    env:
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      RELEASE_TAG: v0.2.7
    steps:
      - name: Create release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "${RELEASE_TAG} already exists"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" \
              -f sha="${GITHUB_SHA}"
          fi

      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/learn-list-release.jks
        run: |
          set -euo pipefail
          test -n "${RELEASE_KEYSTORE_BASE64}"
          echo "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${RELEASE_KEYSTORE_PATH}"
          echo "RELEASE_KEYSTORE_PATH=${RELEASE_KEYSTORE_PATH}" >> "${GITHUB_ENV}"

      - name: Build signed release
        run: ./gradlew assembleRelease

      - name: Verify release signature
        run: |
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Prepare release assets
        run: |
          apk="${RUNNER_TEMP}/learn-list-${RELEASE_TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "${apk}"
          sha256sum "${apk}" | awk '{print $1}' > "${apk}.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "${RELEASE_TAG} already has a release"
            exit 0
          fi
          gh release create "${RELEASE_TAG}" \
            "${RUNNER_TEMP}/learn-list-${RELEASE_TAG}.apk" \
            "${RUNNER_TEMP}/learn-list-${RELEASE_TAG}.apk.sha256" \
            --verify-tag --generate-notes --title "Learn List ${RELEASE_TAG}"
