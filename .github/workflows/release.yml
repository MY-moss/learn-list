name: Android Release

on: push

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/learn-list-release.jks
    steps:
      - name: Check release tag
        id: release_ref
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping release for non-version ref: $GITHUB_REF_NAME"
          fi

      - name: Checkout
        if: steps.release_ref.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Set up JDK 17
        if: steps.release_ref.outputs.enabled == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.release_ref.outputs.enabled == 'true'
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        if: steps.release_ref.outputs.enabled == 'true'
        run: sdkmanager "platforms;android-36" "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        if: steps.release_ref.outputs.enabled == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        if: steps.release_ref.outputs.enabled == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE_PATH"

      - name: Build signed release
        if: steps.release_ref.outputs.enabled == 'true'
        run: ./gradlew assembleRelease

      - name: Verify release signature
        if: steps.release_ref.outputs.enabled == 'true'
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Prepare release assets
        if: steps.release_ref.outputs.enabled == 'true'
        run: |
          apk="$RUNNER_TEMP/learn-list-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" | awk '{print $1}' > "$apk.sha256"

      - name: Create GitHub Release
        if: steps.release_ref.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/learn-list-${GITHUB_REF_NAME}.apk" \
            "$RUNNER_TEMP/learn-list-${GITHUB_REF_NAME}.apk.sha256" \
            --verify-tag --generate-notes --title "Learn List ${GITHUB_REF_NAME}"
